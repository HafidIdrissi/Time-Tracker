name: Build Windows release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          py -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m pip install "pyinstaller>=6,<7"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          .\build_release.ps1 -Version $version

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")

          $installer = Join-Path $PWD "release\LocalTimeTracker-Setup-$version-x64.exe"
          $portable = Join-Path $PWD "release\LocalTimeTracker-$version-portable-x64.zip"
          $checksums = Join-Path $PWD "release\SHA256SUMS.txt"

          foreach ($artifact in @($installer, $portable, $checksums)) {
            if (-not (Test-Path -LiteralPath $artifact)) {
              throw "Expected release artifact not found: $artifact"
            }
          }

          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag `
              $installer `
              $portable `
              $checksums `
              --clobber
          } else {
            gh release create $tag `
              $installer `
              $portable `
              $checksums `
              --verify-tag `
              --generate-notes `
              --title "Local Time Tracker $tag"
          }
