name: Windows validation

on:
  pull_request:
    paths:
      - "windows_app.py"
      - "timetracker/**"
      - "build*.ps1"
      - "packaging/**"
      - "tests/**"
      - ".github/workflows/windows-validation.yml"
  push:
    branches: [main]
    paths:
      - "windows_app.py"
      - "timetracker/**"
      - "build*.ps1"
      - "packaging/**"
      - "tests/**"
      - ".github/workflows/windows-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  desktop:
    name: Native Tk desktop
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Test real Tk widgets with fictional activity
        run: python tests/windows_desktop_smoke.py

  packaging:
    name: Windows installer and portable
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: "checkout with spaces"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare build environment
        working-directory: "checkout with spaces"
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt "pyinstaller>=6,<7"
          if ($LASTEXITCODE -ne 0) { throw "Build dependencies failed." }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Validate release invocations, packages and checksums
        working-directory: "checkout with spaces"
        shell: pwsh
        run: |
          # Exercise the documented local command without Actions-only variables.
          $taskRunnerTemp = $env:RUNNER_TEMP
          try {
            Remove-Item Env:RUNNER_TEMP -ErrorAction SilentlyContinue
            .\tests\windows_release_smoke.ps1
          }
          finally {
            $env:RUNNER_TEMP = $taskRunnerTemp
          }
      - name: Keep validated build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validated-windows-packages
          path: |
            checkout with spaces/release/LocalTimeTracker-Setup-*-x64.exe
            checkout with spaces/release/LocalTimeTracker-*-portable-x64.zip
            checkout with spaces/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
